<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter dashboard | Kairos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-screen">
  <header class="dashboard-header">
    <a class="dashboard-brand" href="index.html">Kairos<span>.</span></a>
    <span class="workspace-label">Recruiter workspace</span>
    <button class="theme-button" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch theme">☾</button>
    <button class="profile-button" id="signOut" type="button">Sign out</button>
  </header>

  <main class="dashboard-main">
    <section class="dashboard-intro">
      <div>
        <p class="small-heading">RECRUITER WORKSPACE</p>
        <h1>Find the students<br>your team needs.</h1>
        <p id="welcomeText">Create a clear, flexible opportunity and put it in front of students ready to contribute.</p>
      </div>
      <div class="intro-stat"><strong id="jobCount">0</strong><span>active jobs</span></div>
    </section>

    <section class="dashboard-grid">
      <section id="post-job" class="job-form-card">
        <div class="section-heading"><div><p class="small-heading">NEW OPPORTUNITY</p><h2>Post a part-time job</h2></div><span class="step-tag">Step 1 of 1</span></div>
        <form id="jobForm">
          <label for="jobTitle">Job title</label><input id="jobTitle" required placeholder="e.g. Café Team Member">
          <div class="two-fields"><div><label for="jobType">Work arrangement</label><select id="jobType" required><option value="" disabled selected>Choose</option><option>On-site</option><option>Hybrid</option><option>Remote</option></select></div><div><label for="jobLocation">Location</label><input id="jobLocation" required placeholder="e.g. Connaught Place"></div></div>
          <div class="three-fields"><div><label for="jobHours">Hours per week</label><select id="jobHours" required><option value="" disabled selected>Choose</option><option>5–10 hours</option><option>10–15 hours</option><option>15–20 hours</option><option>20+ hours</option></select></div><div><label for="jobPay">Pay</label><input id="jobPay" required placeholder="e.g. ₹180 / hour"></div><div><label for="jobVacancies">Vacancies</label><input id="jobVacancies" type="number" min="1" max="99" value="1" required></div></div>
          <label for="jobDescription">About the role</label><textarea id="jobDescription" required maxlength="300" placeholder="Describe what the student will do, the skills you value, and the schedule."></textarea>
          <button class="sign-in-button" type="submit">Publish job <span>→</span></button>
          <p id="jobMessage" class="message" aria-live="polite"></p>
        </form>
      </section>

      <section id="jobs" class="jobs-panel">
        <div class="section-heading"><div><p class="small-heading">YOUR LISTINGS</p><h2>Posted jobs</h2></div><button id="showActiveJobs" class="text-action" type="button">Active only</button></div>
        <div id="jobsList" class="jobs-list"></div>
      </section>
    </section>
  </main>
  <script src="recruiter.js"></script>
</body>
</html>
